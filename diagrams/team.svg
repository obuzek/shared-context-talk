  <text class="title" x="0" y="820">“The top 10% of engineers are about twice as productive as the median,</text>
  <text class="title" x="0" y="858">and they spend 10x the tokens to get there.”</text>
  <text class="sm muted" x="0" y="900">Nicholas Arcolano, Head of Research, Jellyfish (WorkOS interview, Aug 2026)</text>
