<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="../ibm/diagram.css" type="text/css"?>
<!-- Shared context maintained solely by agents, over time. IMAGINARY data, drawn by hand on
     purpose (wobble filter + handwriting labels) so it reads as a projection, not a measurement.
     Chart layout (1350 x 915). -->
<svg xmlns="http://www.w3.org/2000/svg" class="ibm-diagram sketch" viewBox="0 0 1350 915">
  <defs>
    <filter id="rough" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1390" height="955">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>
  </defs>

  <!-- axes, with hand-drawn arrowheads -->
  <path class="edge plain muted" d="M82 820 C 81 600, 80 300, 80 40"/>
  <path class="edge plain muted" d="M64 66 L80 38 L96 66"/>
  <path class="edge plain muted" d="M80 820 C 400 822, 900 818, 1320 821"/>
  <path class="edge plain muted" d="M1294 804 L1322 821 L1294 838"/>

  <!-- how much is in it: keeps growing (drawn twice, slightly off, like a pen going over it) -->
  <path class="edge plain accent" d="M100 760 C 500 742, 900 600, 1290 90"/>
  <path class="edge plain accent" d="M104 756 C 505 736, 905 596, 1296 84"/>
  <text class="hand accent end" x="1190" y="150">how much is in it</text>

  <!-- how much of it is still true: flat, then sagging -->
  <path class="edge plain dashed" d="M100 760 C 400 718, 700 700, 1290 735"/>
  <text class="hand" x="960" y="790">how much of it is still true</text>

  <!-- the gap between them -->
  <path class="edge plain muted" d="M1100 400 C 1100 500, 1101 600, 1102 690"/>
  <path class="edge plain muted" d="M1086 664 L1102 692 L1118 664"/>
  <text class="hand sm muted" x="1126" y="500">conflicting,</text>
  <text class="hand sm muted" x="1126" y="534">out-of-date,</text>
  <text class="hand sm muted" x="1126" y="568">“resolved” from</text>
  <text class="hand sm muted" x="1126" y="602">misinformation</text>

  <text class="hand sm muted" x="100" y="872">time, with no outside intervention →</text>
  <text class="hand sm muted" x="100" y="908">(imagined, not measured)</text>
</svg>
