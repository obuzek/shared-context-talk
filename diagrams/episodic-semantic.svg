<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="../ibm/diagram.css" type="text/css"?>
<!-- Episodic to semantic: what the agent did gets consolidated, under watch, into durable knowledge:
     a history of the organization. Clicks: consolidation, semantic history, episodes fade. Chart layout (1350 x 915). -->
<svg xmlns="http://www.w3.org/2000/svg" class="ibm-diagram" viewBox="0 0 1350 915">
  <text class="title" x="0" y="50">episodic</text>
  <text class="sm muted" x="0" y="82">what the agent did</text>
  <g class="fragment semi-fade-out" data-fragment-index="3">
    <rect class="node" x="0" y="120" width="330" height="70"/>
    <text class="sm" x="20" y="162">run 4812: retried deploy</text>
    <rect class="node" x="0" y="210" width="330" height="70"/>
    <text class="sm" x="20" y="252">run 4813: reverted config X</text>
    <rect class="node" x="0" y="300" width="330" height="70"/>
    <text class="sm" x="20" y="342">run 4815: fixed flaky test</text>
    <rect class="node" x="0" y="390" width="330" height="70"/>
    <text class="sm" x="20" y="432">run 4816: retried deploy</text>
    <rect class="node" x="0" y="480" width="330" height="70"/>
    <text class="sm" x="20" y="522">run 4820: updated runbook</text>
    <rect class="node" x="0" y="570" width="330" height="70"/>
    <text class="sm" x="20" y="612">run 4821: retried deploy</text>
    <rect class="node" x="0" y="660" width="330" height="70"/>
    <text class="sm" x="20" y="702">run 4829: reverted config X</text>
    <text class="sm muted" x="20" y="776">…thousands more</text>
  </g>

  <!-- click 1: consolidation, watched -->
  <g class="fragment" data-fragment-index="1">
    <line class="edge" x1="330" y1="430" x2="450" y2="430"/>
    <rect class="node" x="450" y="330" width="420" height="200"/>
    <text class="title mid" x="660" y="410">consolidation</text>
    <text class="sm muted mid" x="660" y="450">what stays true?</text>
    <text class="agent mid" x="600" y="250">🤖</text>
    <text class="agent mid" x="720" y="250">🧑</text>
    <line class="edge plain muted dashed" x1="600" y1="285" x2="620" y2="330"/>
    <line class="edge plain muted dashed" x1="720" y1="285" x2="700" y2="330"/>
    <text class="sm muted mid" x="660" y="170">an agent, and likely a human, watching</text>
  </g>

  <!-- click 2: durable semantic memory -->
  <g class="fragment" data-fragment-index="2">
    <line class="edge" x1="870" y1="430" x2="960" y2="430"/>
    <text class="title" x="960" y="50">semantic</text>
    <text class="sm muted" x="960" y="82">what we know</text>
    <rect class="node" x="960" y="120" width="390" height="610"/>
    <text class="sm" x="984" y="180">how the deploy pipeline</text>
    <text class="sm" x="984" y="206">came to be</text>
    <line class="edge plain muted" x1="984" y1="240" x2="1326" y2="240"/>
    <text class="sm" x="984" y="290">why config X keeps</text>
    <text class="sm" x="984" y="316">getting reverted</text>
    <line class="edge plain muted" x1="984" y1="350" x2="1326" y2="350"/>
    <text class="sm" x="984" y="400">deploys are flaky on Mondays:</text>
    <text class="sm" x="984" y="426">retry once, then page</text>
    <line class="edge plain muted" x1="984" y1="460" x2="1326" y2="460"/>
    <text class="sm" x="984" y="510">what happened in</text>
    <text class="sm" x="984" y="536">the Q3 outage</text>
    <text class="title accent" x="960" y="790">a history of the organization</text>
  </g>
</svg>
