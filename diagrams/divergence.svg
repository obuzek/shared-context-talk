<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="../ibm/diagram.css" type="text/css"?>

<!-- Divergence: a clean codebase (one of each thing, neatly stacked) vs a wild chaos garden (2-3 competing versions of the same things).
     Chart layout, cols 2-4 (1350 x 915). -->
<svg xmlns="http://www.w3.org/2000/svg" class="ibm-diagram" viewBox="0 0 1350 915">
  <text class="title" x="0" y="50">clean codebase</text>
  <text class="title" x="720" y="50">wild chaos garden</text>
  <line class="edge plain muted" x1="660" y1="0" x2="660" y2="915"/>
  <rect class="node" x="0" y="120" width="180" height="100"/>
  <text class="mid" x="90" y="170">config</text>
  <rect class="node" x="205" y="120" width="180" height="100"/>
  <text class="mid" x="295" y="170">auth</text>
  <rect class="node" x="410" y="120" width="180" height="100"/>
  <text class="mid" x="500" y="170">logging</text>
  <rect class="node" x="0" y="250" width="180" height="100"/>
  <text class="mid" x="90" y="300">api client</text>
  <rect class="node" x="205" y="250" width="180" height="100"/>
  <text class="mid" x="295" y="300">db</text>
  <rect class="node" x="410" y="250" width="180" height="100"/>
  <text class="mid" x="500" y="300">cache</text>
  <rect class="node" x="0" y="380" width="180" height="100"/>
  <text class="mid" x="90" y="430">jobs</text>
  <rect class="node" x="205" y="380" width="180" height="100"/>
  <text class="mid" x="295" y="430">metrics</text>
  <rect class="node" x="410" y="380" width="180" height="100"/>
  <text class="mid" x="500" y="430">ui</text>
  <line class="edge plain muted dashed" x1="1205" y1="340" x2="1195" y2="135"/>
  <line class="edge plain muted dashed" x1="1095" y1="460" x2="825" y2="730"/>
  <line class="edge plain muted dashed" x1="845" y1="150" x2="1015" y2="210"/>
  <line class="edge plain muted dashed" x1="1215" y1="560" x2="1015" y2="210"/>
  <line class="edge plain muted dashed" x1="1205" y1="340" x2="1015" y2="640"/>
  <line class="edge plain muted dashed" x1="845" y1="150" x2="1215" y2="560"/>
  <line class="edge plain muted dashed" x1="825" y1="370" x2="845" y2="150"/>
  <line class="edge plain muted dashed" x1="1015" y1="210" x2="1095" y2="460"/>
  <line class="edge plain muted dashed" x1="1095" y1="460" x2="1015" y2="210"/>
  <g transform="rotate(-6 845 150)"><rect class="node" x="760" y="110" width="170" height="80"/><text class="sm mid" x="845" y="150">config</text></g>
  <g transform="rotate(8 1015 210)"><rect class="node fill" x="930" y="170" width="170" height="80"/><text class="sm mid" x="1015" y="210">config_v2</text></g>
  <g transform="rotate(-3 1195 135)"><rect class="node accent-outline" x="1110" y="95" width="170" height="80"/><text class="sm mid" x="1195" y="135">ConfigLoader</text></g>
  <g transform="rotate(4 825 370)"><rect class="node" x="740" y="330" width="170" height="80"/><text class="sm mid" x="825" y="370">auth</text></g>
  <g transform="rotate(-9 985 330)"><rect class="node accent-outline" x="900" y="290" width="170" height="80"/><text class="sm mid" x="985" y="330">authHelper</text></g>
  <g transform="rotate(6 1205 340)"><rect class="node fill" x="1120" y="300" width="170" height="80"/><text class="sm mid" x="1205" y="340">logging</text></g>
  <g transform="rotate(-5 1095 460)"><rect class="node" x="1010" y="420" width="170" height="80"/><text class="sm mid" x="1095" y="460">log_utils</text></g>
  <g transform="rotate(10 845 520)"><rect class="node accent-outline" x="760" y="480" width="170" height="80"/><text class="sm mid" x="845" y="520">logger_new</text></g>
  <g transform="rotate(-7 1215 560)"><rect class="node" x="1130" y="520" width="170" height="80"/><text class="sm mid" x="1215" y="560">api client</text></g>
  <g transform="rotate(5 1015 640)"><rect class="node fill" x="930" y="600" width="170" height="80"/><text class="sm mid" x="1015" y="640">apiClient2</text></g>
  <g transform="rotate(-4 825 730)"><rect class="node" x="740" y="690" width="170" height="80"/><text class="sm mid" x="825" y="730">db</text></g>
  <g transform="rotate(9 1235 740)"><rect class="node accent-outline" x="1150" y="700" width="170" height="80"/><text class="sm mid" x="1235" y="740">cache</text></g>
  <g transform="rotate(-8 1045 820)"><rect class="node" x="960" y="780" width="170" height="80"/><text class="sm mid" x="1045" y="820">cache (copy)</text></g>
</svg>
