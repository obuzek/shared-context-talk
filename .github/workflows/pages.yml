# Publishes the deck to GitHub Pages on every push to main.
# Checks out LFS files (the video) and copies only what the deck loads, plus reveal.js from npm.
name: Deploy deck to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/reveal.js
          cp -R index.html slides.md talk.css ibm img diagrams _site/
          cp -R node_modules/reveal.js/dist node_modules/reveal.js/plugin _site/node_modules/reveal.js/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
